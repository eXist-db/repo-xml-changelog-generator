version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: "03:00"
  open-pull-requests-limit: 10
  # Batch related tooling; leave @xmldom/xmldom (the only runtime dep)
  # ungrouped so its bumps stay visible.
  groups:
    commitlint:
      patterns:
        - "@commitlint/*"
        - "husky"
    semantic-release:
      patterns:
        - "semantic-release"
        - "@semantic-release/*"
        - "conventional-changelog-*"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    github-actions:
      patterns:
        - "*"
